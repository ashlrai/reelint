[project]
name = "reelint"
version = "0.1.0"
description = "A linter for short-form video: catch the edits that make viewers swipe away, before you post."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "tomli>=2.0; python_version < '3.11'"]
keywords = ["reels", "shorts", "tiktok", "video", "linter", "retention", "ffmpeg", "creator-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
vision = ["rapidocr>=3.0", "onnxruntime>=1.17", "opencv-python-headless>=4.8,<5"]
dev = ["pytest>=8.0"]

[project.scripts]
reelint = "reelint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
